<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Formulário | Filipe Robert Soares</title>
  </head>

  <body>
    <div class="container">
      <header>
        <div>
          <h1>F/R/S.</h1>
        </div>
        <nav>
          <a href="index.html">Início</a>
          <a href="curriculo.html">Currículo</a>
          <a href="formulario.html">Formulário</a>
          <a href="multimidia.html">Multimídia</a>
          <a href="grafico.html">Gráfico</a>
        </nav>
      </header>
      <div class="label_tools">
        <button type="button" id="alternar-tema" aria-pressed="false">
          <!--botão para mudar a cor do tema com false(desativado)-->
          tema
        </button>
      </div>

      <main class="form_box">
        <form id="form-contato" novalidate>
          <fieldset>
            <legend>Informações de Contato</legend>
            <h1>Formulário de Contato</h1>

            <div class="form_group">
              <label for="nome">Nome:</label>
              <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Seu nome completo"
                required
              />
            </div>

            <div class="form_group">
              <label for="email">E-mail:</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="seuemail@exemplo.com"
                required
              />
            </div>

            <div class="form_group">
              <label for="password">Senha:</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Senha"
                required
              />
            </div>

            <div class="form_group">
              <label for="telefone">Contato:</label>
              <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="(11)-9xxxx-xxxx"
                pattern="\([0-9]{2}\)\s?[0-9]{5}-[0-9]{4}"
                required
              />
            </div>
            <div class="genre">
              <div class="form_group">
                <label for="genero_m">Masculino:</label>
                <input
                  type="radio"
                  id="genero_m"
                  name="genero"
                  value="masculino"
                  required
                />
              </div>
              <div class="form_group">
                <label for="genero_f">Feminino:</label>
                <input
                  type="radio"
                  id="genero_f"
                  name="genero"
                  value="feminino"
                  required
                />
              </div>
            </div>
            <div class="form_group">
              <label for="mensagem">Mensagem:</label>
              <textarea
                id="mensagem"
                name="mensagem"
                rows="5"
                placeholder="Escreva sua mensagem aqui..."
              ></textarea>
            </div>

            <div class="form_buttons">
              <button type="submit">Enviar</button>
              <button type="reset">Limpar</button>
            </div>
            <div
              id="feedback-formulario"
              class="c3-message"
              role="status"
              aria-live="polite"
            ></div>
          </fieldset>
        </form>
      </main>

      <footer>
        <p>
          &copy; Feito por Filipe Robert Soares <br />
          Estudante de ADS na BrazCubas
        </p>
      </footer>
    </div>
    <script src="js/scripts.js" defer></script>
  </body>
</html>
